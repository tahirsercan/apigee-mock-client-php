name: Psalm Security Scan

on:
  push:
    branches: [ "1.x" ]
  pull_request:
    branches: [ "1.x" ]
  schedule:
    - cron: '43 4 * * 5'

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Psalm Security Scan
        uses: psalm/psalm-github-security-scan@v3.15.0

      - name: Upload Security Analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
