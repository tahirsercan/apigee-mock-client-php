name: Psalm Security Scan

on:
  push:
    branches: [ "1.x" ]
  pull_request:
    branches: [ "1.x" ]
  schedule:
    - cron: '39 14 * * 4'

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: mbstring, xml
          tools: composer

      - name: Install Psalm globally
        run: composer global require vimeo/psalm

      - name: Initialize Psalm config if not exists
        run: |
          if [ ! -f psalm.xml ]; then
            ~/.composer/vendor/bin/psalm --init --root=apigee-mock-client-php
          fi

      - name: Run Psalm Security Scan
        run: |
          ~/.composer/vendor/bin/psalm --root=apigee-mock-client-php --output-format=sarif > results.sarif

      - name: Upload Security Analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
